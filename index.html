<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAUDEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#101733; --night2:#070b1c;
  --magma1:#8f1420; --magma2:#5a0a14; --magma3:#a52418;
  --red:#f5484f; --red-dark:#b7262f;
  --blue:#2fa3f3; --gold:#f5b93b;
  --cream:#f8f2e2; --ink:#33291f;
  --outline:#2b211a;
  --purple1:#7b3fd4; --purple2:#3c1f7a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family: "Jersey 10" ;
  background:radial-gradient(ellipse at 50% 30%, var(--night1) 0%, var(--night2) 85%);
  color:#fff; overflow-x:hidden; min-height:100%;
  display:flex; flex-direction:column; align-items:center;
}
/* fond magma : blobs informes qui dérivent (façon écran de veille) */
.lava{
  position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  filter:blur(46px) saturate(1.15);
}
.blob{
  position:absolute; border-radius:50%;
  will-change:transform;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
}
.blob.b1{
  width:44vmax; height:38vmax; left:-12vmax; top:-8vmax;
  background:radial-gradient(closest-side, var(--magma1) 0%, transparent 72%);
  animation:drift1 37s infinite;
}
.blob.b2{
  width:36vmax; height:42vmax; right:-14vmax; top:12vmax;
  background:radial-gradient(closest-side, var(--magma2) 0%, transparent 70%);
  animation:drift2 29s infinite;
}
.blob.b3{
  width:40vmax; height:32vmax; left:8vmax; bottom:-16vmax;
  background:radial-gradient(closest-side, var(--magma3) 0%, transparent 74%);
  animation:drift3 43s infinite;
  opacity:.8;
}
.blob.b4{
  width:26vmax; height:28vmax; left:38vmax; top:30vmax;
  background:radial-gradient(closest-side, var(--magma1) 0%, transparent 68%);
  animation:drift4 24s infinite;
  opacity:.65;
}
.blob.b5{
  width:22vmax; height:20vmax; right:6vmax; bottom:-4vmax;
  background:radial-gradient(closest-side, var(--magma2) 0%, transparent 70%);
  animation:drift5 33s infinite;
  opacity:.75;
}
/* trajectoires irrégulières : chaque blob a son propre chemin, ses étirements */
@keyframes drift1{
  0%   {transform:translate(0,0) scale(1,1)}
  22%  {transform:translate(16vmax,9vmax) scale(1.15,.9)}
  47%  {transform:translate(30vmax,-4vmax) scale(.92,1.12)}
  71%  {transform:translate(9vmax,14vmax) scale(1.08,1.02)}
  100% {transform:translate(0,0) scale(1,1)}
}
@keyframes drift2{
  0%   {transform:translate(0,0) scale(1,1)}
  30%  {transform:translate(-20vmax,10vmax) scale(1.2,.85)}
  55%  {transform:translate(-8vmax,26vmax) scale(.9,1.18)}
  80%  {transform:translate(-24vmax,4vmax) scale(1.05,1)}
  100% {transform:translate(0,0) scale(1,1)}
}
@keyframes drift3{
  0%   {transform:translate(0,0) scale(1,1)}
  25%  {transform:translate(22vmax,-12vmax) scale(.88,1.15)}
  50%  {transform:translate(44vmax,-2vmax) scale(1.18,.9)}
  75%  {transform:translate(14vmax,-18vmax) scale(1,1.08)}
  100% {transform:translate(0,0) scale(1,1)}
}
@keyframes drift4{
  0%   {transform:translate(0,0) scale(1,1)}
  33%  {transform:translate(-14vmax,-16vmax) scale(1.25,.85)}
  66%  {transform:translate(10vmax,-24vmax) scale(.85,1.2)}
  100% {transform:translate(0,0) scale(1,1)}
}
@keyframes drift5{
  0%   {transform:translate(0,0) scale(1,1)}
  40%  {transform:translate(-18vmax,-10vmax) scale(1.1,1.15)}
  70%  {transform:translate(-30vmax,6vmax) scale(.9,.95)}
  100% {transform:translate(0,0) scale(1,1)}
}
/* scanlines CRT */
.crt{
  position:fixed; inset:0; z-index:50; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0 2px, transparent 2px 4px);
  mix-blend-mode:multiply;
}
main{position:relative; z-index:1; width:100%; max-width:900px; padding:22px 16px 90px; display:flex; flex-direction:column; align-items:center}

/* ---------- TITRE ---------- */
h1{
  font-weight:700; font-size:clamp(42px,9vw,72px); letter-spacing:2px;
  color:var(--red);
  text-shadow:0 4px 0 var(--red-dark), 0 8px 0 rgba(0,0,0,.45);
  transform:rotate(-2deg);
  animation:breathe 3.2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(-1deg) scale(1.035)}}
.tagline{
  font-size:15px; color:#c9d4ef; opacity:.85; margin-top:2px; letter-spacing:1px;
  text-shadow:0 2px 0 rgba(0,0,0,.5);
}

/* ---------- PANNEAU NIVEAU ---------- */
.panel{
  margin-top:26px; width:min(560px,100%);
  background:#1b2547;
  border:4px solid var(--outline); border-radius:14px;
  box-shadow:0 7px 0 rgba(0,0,0,.42), inset 0 2px 0 rgba(255,255,255,.08);
  padding:18px 22px 22px;
}
.panel-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.panel-head .lbl{font-size:15px; letter-spacing:2px; color:#b8c5e8; text-shadow:0 2px 0 rgba(0,0,0,.5)}
.stake{
  font-size:20px; font-weight:700; padding:3px 12px; border-radius:8px;
  border:3px solid var(--outline); box-shadow:0 4px 0 rgba(0,0,0,.35);
  text-shadow:0 2px 0 rgba(0,0,0,.4);
  transition:background .25s;
}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:22px;
  background:linear-gradient(180deg,#0e1530,#080d20);
  border:3px solid var(--outline); border-radius:11px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.6); outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:40px; height:40px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0 18%, var(--cream) 19% 100%);
  border:4px solid var(--outline);
  box-shadow:0 5px 0 rgba(0,0,0,.45);
  transition:transform .12s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.08)}
input[type=range]::-moz-range-thumb{
  width:34px;height:34px;border-radius:50%;
  background:var(--cream); border:4px solid var(--outline);
  box-shadow:0 5px 0 rgba(0,0,0,.45); cursor:pointer;
}
.ticks{display:flex; justify-content:space-between; padding:6px 8px 0; font-size:14px; color:#8f9dc9}
.ticks span{width:24px; text-align:center; text-shadow:0 2px 0 rgba(0,0,0,.5)}
.ticks span.on{color:#fff; font-weight:700}

/* ---------- BOUTONS ---------- */
.gowrap{margin-top:22px; display:flex; flex-direction:column; gap:14px; align-items:center}
button{font-family:inherit; cursor:pointer}
.go{
  font-size:30px; font-weight:700; letter-spacing:3px; color:#fff;
  background:linear-gradient(180deg,var(--red),var(--red-dark));
  border:4px solid var(--outline); border-radius:14px;
  padding:12px 46px 14px;
  box-shadow:0 8px 0 #6e1218, 0 12px 0 rgba(0,0,0,.35);
  text-shadow:0 3px 0 rgba(0,0,0,.4);
  transition:transform .08s, box-shadow .08s;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
.go:active{transform:translateY(6px); box-shadow:0 2px 0 #6e1218, 0 5px 0 rgba(0,0,0,.35)}
.go:disabled{opacity:.55; cursor:default; animation:none}
.btn2{
  font-size:19px; font-weight:700; letter-spacing:2px; color:#fff;
  background:linear-gradient(180deg,#3562b8,#22407e);
  border:4px solid var(--outline); border-radius:12px;
  padding:8px 26px 10px;
  box-shadow:0 6px 0 #142650, 0 9px 0 rgba(0,0,0,.3);
  text-shadow:0 2px 0 rgba(0,0,0,.4);
  transition:transform .08s, box-shadow .08s;
}
.btn2:active{transform:translateY(4px); box-shadow:0 2px 0 #142650, 0 4px 0 rgba(0,0,0,.3)}
.btn2.gold{
  background:linear-gradient(180deg,var(--gold),#c98d1d);
  box-shadow:0 6px 0 #7d5a10, 0 9px 0 rgba(0,0,0,.3);
}
.btn2.gold:active{box-shadow:0 2px 0 #7d5a10, 0 4px 0 rgba(0,0,0,.3)}
.btn2:disabled{opacity:.55; cursor:default}
.hidden{display:none !important}

/* ---------- ZONE DE JEU ---------- */
.arena{width:100%; margin-top:30px; min-height:340px; display:flex; flex-direction:column; align-items:center}

/* animation de recherche : cartes qui rebondissent + bulles */
.shuffle{display:flex; gap:18px; margin-top:40px}
.cardback{
  width:86px; height:120px; border-radius:10px;
  border:4px solid var(--outline);
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.16) 0 6px, transparent 7px),
    repeating-linear-gradient(45deg, var(--red) 0 10px, var(--red-dark) 10px 20px);
  box-shadow:0 7px 0 rgba(0,0,0,.4);
  animation:bounce .55s ease-in-out infinite;
}
.cardback:nth-child(2){animation-delay:.14s;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.16) 0 6px, transparent 7px),
    repeating-linear-gradient(45deg, var(--blue) 0 10px, #1668a8 10px 20px);}
.cardback:nth-child(3){animation-delay:.28s}
@keyframes bounce{
  0%,100%{transform:translateY(0) rotate(-4deg) scaleY(1)}
  35%{transform:translateY(-34px) rotate(3deg) scaleY(1.06)}
  70%{transform:translateY(2px) rotate(-2deg) scaleY(.92)}
}
.bubbles{position:relative; width:0; height:0}
.bub{
  position:absolute; font-weight:700; color:var(--gold);
  text-shadow:0 3px 0 rgba(0,0,0,.5);
  animation:rise 1.1s ease-out forwards;
}
@keyframes rise{
  0%{transform:translateY(0) scale(.4); opacity:0}
  25%{opacity:1}
  100%{transform:translateY(-120px) scale(1.25) rotate(14deg); opacity:0}
}
.search-msg{margin-top:34px; font-size:19px; color:#e9dfae; letter-spacing:1px; text-shadow:0 2px 0 rgba(0,0,0,.5)}

/* ---------- CARTE SUJET ---------- */
.topic{
  width:min(620px,100%);
  background:linear-gradient(180deg,#fffaf0,var(--cream));
  color:var(--ink);
  border:5px solid var(--outline); border-radius:16px;
  box-shadow:0 9px 0 rgba(0,0,0,.45);
  padding:20px 24px; text-align:center; position:relative;
  transform:rotate(-1.2deg);
  animation:slam .45s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes slam{
  0%{transform:scale(2.1) rotate(8deg); opacity:0}
  100%{transform:scale(1) rotate(-1.2deg); opacity:1}
}
.topic .lvl-chip{
  position:absolute; top:-16px; left:-14px;
  font-size:20px; font-weight:700; color:#fff;
  border:4px solid var(--outline); border-radius:50%;
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.4); text-shadow:0 2px 0 rgba(0,0,0,.4);
  transform:rotate(-8deg);
}
.topic .kicker{font-size:14px; letter-spacing:3px; color:#a3937c; margin-bottom:4px}
.topic h2{font-size:clamp(24px,5vw,34px); font-weight:700; line-height:1.15}

/* ---------- QUESTIONS ---------- */
.hand{width:min(620px,100%); display:flex; flex-direction:column; gap:14px; margin-top:20px}
.q{
  background:linear-gradient(180deg,#fffaf0,var(--cream));
  color:var(--ink);
  border:4px solid var(--outline); border-radius:13px;
  box-shadow:0 7px 0 rgba(0,0,0,.4);
  padding:14px 18px; display:flex; gap:14px; align-items:flex-start;
  opacity:0; transform:translateY(60px) rotate(3deg);
  animation:deal .5s cubic-bezier(.2,1.4,.4,1) forwards;
  transition:transform .15s;
}
.q:hover{transform:rotate(-.6deg) scale(1.015)}
.q:nth-child(1){animation-delay:.25s}
.q:nth-child(2){animation-delay:.45s}
.q:nth-child(3){animation-delay:.65s}
@keyframes deal{to{opacity:1; transform:translateY(0) rotate(0)}}
.q .num{
  flex:0 0 auto; width:38px; height:38px; border-radius:9px;
  border:3px solid var(--outline);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:700; color:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.35); text-shadow:0 2px 0 rgba(0,0,0,.35);
}
.q:nth-child(1) .num{background:var(--red)}
.q:nth-child(2) .num{background:var(--blue)}
.q:nth-child(3) .num{background:#3fae6a}
.q .body{flex:1}
.q .tag{
  display:inline-block; font-size:26px; font-weight:700; letter-spacing:2px;
  background:var(--red); color:#fff; border:2px solid var(--outline);
  border-radius:6px; padding:2px 8px; margin-bottom:5px;
  box-shadow:0 2px 0 rgba(0,0,0,.3);
}
.q .tag.open{background:#8a7c68}
.q p{font-size:28px; line-height:1.3; font-weight:500}

/* ---------- VOTE Q1 ---------- */
.voterow{display:flex; gap:12px; margin-top:12px; align-items:center; flex-wrap:wrap}
.votebtn{
  font-family:inherit; font-size:22px; font-weight:700; letter-spacing:2px; color:#fff;
  border:3px solid var(--outline); border-radius:10px; padding:6px 26px 8px;
  box-shadow:0 5px 0 rgba(0,0,0,.35); text-shadow:0 2px 0 rgba(0,0,0,.4);
  cursor:pointer; transition:transform .08s, box-shadow .08s;
}
.votebtn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.35)}
.votebtn.va{background:linear-gradient(180deg,#4cc06d,#2c8a4a)}
.votebtn.vb{background:linear-gradient(180deg,var(--red),var(--red-dark))}
.votebtn.vn{background:linear-gradient(180deg,#3562b8,#22407e)}
.gauge{
  position:relative; width:100%; height:36px; border-radius:10px;
  border:3px solid var(--outline); overflow:hidden;
  background:linear-gradient(180deg,var(--red),var(--red-dark));
  box-shadow:0 4px 0 rgba(0,0,0,.3);
}
.gauge.neutral{background:linear-gradient(180deg,#3562b8,#22407e)}
.gfill{
  position:absolute; inset:0 auto 0 0; width:0;
  background:linear-gradient(180deg,#4cc06d,#2c8a4a);
  border-right:3px solid var(--outline);
  transition:width .9s cubic-bezier(.2,1.2,.4,1);
}
.gauge.neutral .gfill{background:linear-gradient(180deg,var(--gold),#c98d1d)}
.glab{
  position:absolute; top:50%; transform:translateY(-50%);
  font-size:18px; font-weight:700; color:#fff; letter-spacing:1px;
  text-shadow:0 2px 0 rgba(0,0,0,.5); pointer-events:none; white-space:nowrap;
}
.gl-a{left:10px} .gl-b{right:10px}
.gcount{font-size:16px; color:#8a7c68; margin-top:5px; letter-spacing:1px}

/* ---------- JOKER ---------- */
.jokerzone{margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:14px; width:min(620px,100%)}
.joker-btn{
  width:110px; height:152px; border-radius:12px; border:4px solid var(--outline);
  position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--purple1),var(--purple2));
  box-shadow:0 8px 0 rgba(0,0,0,.45);
  color:#fff; font-family:inherit;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  transform:rotate(2deg);
  transition:transform .15s;
  animation:deal .5s .9s cubic-bezier(.2,1.4,.4,1) both;
}
.joker-btn:hover{transform:rotate(-2deg) scale(1.07)}
.joker-btn:active{transform:scale(.96)}
.joker-btn::after{
  content:""; position:absolute; inset:-60%;
  background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.5) 50%, transparent 58%);
  animation:sheen 2.6s ease-in-out infinite;
}
@keyframes sheen{0%{transform:translateX(-70%)}60%,100%{transform:translateX(70%)}}
.joker-btn .face{font-size:44px; text-shadow:0 4px 0 rgba(0,0,0,.4)}
.joker-btn .name{font-size:15px; font-weight:700; letter-spacing:2px; text-shadow:0 2px 0 rgba(0,0,0,.5)}
.joker-card{
  width:100%;
  border:4px solid var(--outline); border-radius:13px;
  background:linear-gradient(180deg,#2c1b52,#1c1038);
  box-shadow:0 7px 0 rgba(0,0,0,.45), inset 0 0 26px rgba(150,90,255,.25);
  padding:15px 18px; color:#f1e9ff;
  animation:flipin .4s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes flipin{0%{transform:rotateY(90deg) scale(.8); opacity:0}100%{transform:rotateY(0) scale(1); opacity:1}}
.joker-card .jtag{
  display:inline-block; font-size:16px; font-weight:700; letter-spacing:2px;
  border:3px solid var(--outline); border-radius:7px; padding:3px 10px; margin-bottom:8px;
  color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.35); text-shadow:0 2px 0 rgba(0,0,0,.4);
  transform:rotate(-1.5deg);
}
.joker-card p{font-size:22px; line-height:1.35}
.jhint{font-size:13px; color:#b7a8d9; letter-spacing:1px}

/* ---------- FORMULAIRE DE PROPOSITION ---------- */
.propose{
  width:min(620px,100%);
  background:#1b2547;
  border:4px solid var(--outline); border-radius:14px;
  box-shadow:0 7px 0 rgba(0,0,0,.42), inset 0 2px 0 rgba(255,255,255,.08);
  padding:18px 22px 22px;
  animation:deal .4s cubic-bezier(.2,1.4,.4,1) both;
}
.propose h3{
  font-size:26px; letter-spacing:2px; color:var(--gold);
  text-shadow:0 3px 0 rgba(0,0,0,.5); margin-bottom:14px; text-align:center;
}
.field{margin-bottom:14px}
.field label{
  display:block; font-size:17px; letter-spacing:1px; color:#b8c5e8;
  margin-bottom:5px; text-shadow:0 2px 0 rgba(0,0,0,.5);
}
.field label .req{color:var(--red)}
.field input[type=text], .field textarea{
  width:100%; font-family:inherit; font-size:20px; color:var(--ink);
  background:linear-gradient(180deg,#fffaf0,var(--cream));
  border:3px solid var(--outline); border-radius:10px;
  padding:8px 12px; outline:none;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.15);
}
.field input[type=text]:focus, .field textarea:focus{
  border-color:var(--gold);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.15), 0 0 0 3px rgba(245,185,59,.35);
}
.check{
  display:flex; align-items:center; gap:10px; cursor:pointer;
  margin:16px 0 6px; user-select:none;
}
.check input{display:none}
.check .box{
  width:26px; height:26px; flex:0 0 auto; border-radius:7px;
  background:linear-gradient(180deg,#fffaf0,var(--cream));
  border:3px solid var(--outline);
  box-shadow:0 3px 0 rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:700; color:transparent;
  transition:background .12s, color .12s;
}
.check input:checked + .box{background:linear-gradient(180deg,var(--gold),#d99b22); color:var(--ink)}
.check .ctext{font-size:19px; letter-spacing:1px; color:#e6ecfc; text-shadow:0 2px 0 rgba(0,0,0,.5)}
.subpanel{
  border:3px dashed rgba(255,255,255,.22); border-radius:11px;
  padding:12px 14px 4px; margin-bottom:6px;
  background:rgba(0,0,0,.16);
}
.mini-ticks{display:flex; justify-content:space-between; padding:4px 6px 0; font-size:13px; color:#8f9dc9}
.mini-ticks span{width:22px; text-align:center}
.mini-ticks span.on{color:#fff; font-weight:700}
.formrow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
.form-actions{display:flex; gap:14px; justify-content:center; margin-top:18px; flex-wrap:wrap}
.form-msg{
  margin-top:12px; text-align:center; font-size:19px; letter-spacing:1px;
  text-shadow:0 2px 0 rgba(0,0,0,.5); min-height:24px;
}
.form-msg.ok{color:#7fe09a}
.form-msg.err{color:#ff9b9b}

/* couleurs de niveau */
.c1{background:#67b46f}.c2{background:#3fae6a}.c3{background:var(--gold)}.c4{background:#f07f2e}.c5{background:var(--red)}

footer{position:static; bottom:9px; z-index:2; font-size:12px; color:#7d8bb8; letter-spacing:1px; text-shadow:0 2px 0 rgba(0,0,0,.5)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important; animation-delay:0s !important; transition:none !important}
}
@media (max-width:520px){
  .go{font-size:24px; padding:10px 34px}
  .q p{font-size:16px}
  .votebtn{font-size:18px; padding:5px 20px 7px}
}
</style>

function goHome(){
  arena.innerHTML = '';
  proposeBtn.classList.remove('hidden');
  homeBtn.classList.add('hidden');
}
function leaveHome(){
  proposeBtn.classList.add('hidden');
  homeBtn.classList.remove('hidden');
}
homeBtn.addEventListener('click', goHome);

/* ================== SLIDER ================== */
function refreshStake(){
  const v = +lvlInput.value;
  const s = STAKES[v-1];
  stakeLbl.textContent = s.name;
  stakeLbl.className = 'stake ' + s.cls;
  [...$('#ticks').children].forEach((el,i)=>el.classList.toggle('on', i === v-1));
}
lvlInput.addEventListener('input', refreshStake);
refreshStake();

/* ================== TIRAGE ================== */
const SEARCH_MSGS = [
  "Battage des cartes…","Recherche d'un sujet qui fâche…","Consultation du croupier…",
  "Chargement de la mauvaise foi…","Mélange des opinions…","Distribution des points de vue…"
];

goBtn.addEventListener('click', ()=>{
  if(busy) return;
  busy = true; goBtn.disabled = true;
  leaveHome();
  const lvl = +lvlInput.value;
  track('partie_lancee', {niveau: lvl});

  arena.innerHTML = `
    <div class="shuffle">
      <div class="cardback"></div><div class="cardback"></div><div class="cardback"></div>
    </div>
    <div class="bubbles" id="bubbles"></div>
    <div class="search-msg">${SEARCH_MSGS[Math.floor(Math.random()*SEARCH_MSGS.length)]}</div>`;

  const bubbleTimer = setInterval(spawnBubble, 180);
  setTimeout(()=>{
    clearInterval(bubbleTimer);
    reveal(lvl);
    busy = false; goBtn.disabled = false;
  }, 1500);
});

function spawnBubble(){
  const zone = $('#bubbles'); if(!zone) return;
  const b = document.createElement('div');
  b.className = 'bub';
  b.textContent = ['?','!','💥','🃏','⚡'][Math.floor(Math.random()*5)];
  b.style.left = (Math.random()*220 - 110) + 'px';
  b.style.fontSize = (16 + Math.random()*18) + 'px';
  zone.appendChild(b);
  setTimeout(()=>b.remove(), 1200);
}

function pickTopic(lvl){
  const pool = TOPICS[lvl];
  let t;
  do { t = pool[Math.floor(Math.random()*pool.length)]; }
  while (pool.length > 1 && t === lastTopic);
  lastTopic = t;
  return t;
}

/* ================== AFFICHAGE ================== */
function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function qBlock(i, text, type){
  if(!type){
    return `<div class="q"><div class="num">${i}</div>
      <div class="body"><span class="tag open">QUESTION OUVERTE</span><p>${esc(text)}</p></div></div>`;
  }
  const qt = Q1T[type] || Q1T.on;
  const clsA = qt.neutral ? 'vn' : 'va';
  const clsB = qt.neutral ? 'vn' : 'vb';
  return `<div class="q"><div class="num">${i}</div>
    <div class="body"><span class="tag">${qt.tag}</span><p>${esc(text)}</p>
      <div class="voterow" id="voteRow${i}">
        <button class="votebtn ${clsA}" onclick="voteQ(${i},'a')">${qt.a}</button>
        <button class="votebtn ${clsB}" onclick="voteQ(${i},'b')">${qt.b}</button>
      </div>
    </div></div>`;
}
  
function reveal(lvl){
  const t = pickTopic(lvl);
  currentTopic = t;
  track('sujet_tire', {niveau: lvl, sujet: t.t});
  jokerPool = [...t.j].sort(()=>Math.random()-.5);
  const s = STAKES[lvl-1];
  const qt = Q1T[t.q1t] || Q1T.on;
  const clsA = qt.neutral ? 'vn' : 'va';
  const clsB = qt.neutral ? 'vn' : 'vb';

  arena.innerHTML = `
    <div class="topic">
      <div class="lvl-chip ${s.cls}">${lvl}</div>
      <div class="kicker">SUJET — ${s.name}</div>
      <h2>${esc(t.t)}</h2>
    </div>
    <div class="hand">
  ${qBlock(1, t.q1, t.q1t || 'on')}
  ${qBlock(2, t.q2, t.q2t)}
  ${qBlock(3, t.q3, t.q3t)}
</div>
      
    <div class="jokerzone" id="jokerzone">
      <button class="joker-btn" id="jokerBtn" title="Relancer le débat">
        <span class="face">🃏</span><span class="name">JOKER</span>
      </button>
      <div class="jhint">Clique sur le Joker pour avoir du grain à moudre</div>
    </div>`;

  $('#jokerBtn').addEventListener('click', playJoker);
}

/* ================== VOTE Q1 ================== */
async function voteQ(i, choice){
  const row = document.getElementById('voteRow' + i);
  const type = i === 1 ? (currentTopic.q1t || 'on') : currentTopic['q' + i + 't'];
  const qt = Q1T[type] || Q1T.on;
  const label = choice === 'a' ? qt.a : qt.b;
  row.innerHTML = '<span class="gcount">Vote en cours…</span>';
  track('vote_q1', {sujet: currentTopic.t, question: i, choix: label, type_question: qt.tag});

  try{
    const voteKey = currentTopic.t + (i > 1 ? ' #q' + i : '');
    const r = await fetch(PROPOSE_ENDPOINT + '/vote', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic: voteKey, choice: choice})
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const v = await r.json();
    const total = v.a + v.b;
    const pA = Math.round(100 * v.a / total);
    row.innerHTML = `
      <div class="gauge ${qt.neutral ? 'neutral' : ''}"><div class="gfill"></div>
        <span class="glab gl-a">${qt.a} ${pA}%</span>
        <span class="glab gl-b">${100-pA}% ${qt.b}</span>
      </div>
      <div class="gcount">${total} vote${total>1?'s':''} au total — toi : ${label}</div>`;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ row.querySelector('.gfill').style.width = pA + '%'; });
    });
  }catch(err){
    row.innerHTML = '<span class="gcount">❌ Vote non enregistré, réessaie plus tard.</span>';
  }
}

function playJoker(){
  if(!jokerPool.length){
    /* recycle : on remélange */
    jokerPool = [...currentTopic.j].sort(()=>Math.random()-.5);
  }
  const j = jokerPool.pop();
  const meta = JT[j.k];
  track('joker_joue', {type: j.k, sujet: currentTopic.t});
  const zone = $('#jokerzone');
  const old = zone.querySelector('.joker-card');
  if(old) old.remove();
  const card = document.createElement('div');
  card.className = 'joker-card';
  card.innerHTML = `<span class="jtag" style="background:${meta.color}">${meta.label}</span><p>${esc(j.x)}</p>`;
  zone.appendChild(card);
}

/* ================== FORMULAIRE PROPOSITION ================== */
proposeBtn.addEventListener('click', openProposeForm);

function openProposeForm(){
  track('formulaire_ouvert');
  leaveHome();
  arena.innerHTML = `
  <div class="propose">
    <h3>💡 PROPOSER UN THÈME</h3>

    <div class="formrow">
      <span class="field label" style="font-size:17px; color:#b8c5e8; letter-spacing:1px">NIVEAU DE DANGER <span class="req">*</span></span>
      <span class="stake c1" id="pStake">TRANQUILLE</span>
    </div>
    <input type="range" id="pLvl" min="1" max="5" step="1" value="1">
    <div class="mini-ticks" id="pTicks">
      <span class="on">1</span><span>2</span><span>3</span><span>4</span><span>5</span>
    </div>

    <div class="field" style="margin-top:14px">
      <label>NOM DU THÈME <span class="req">*</span></label>
      <input type="text" id="pTheme" maxlength="80" placeholder="Ex : Les mecs qui s'habillent style Peaky Blinders">
    </div>

    <div class="field">
      <label>TON PRÉNOM / PSEUDO <span style="color:#8f9dc9">(facultatif)</span></label>
      <input type="text" id="pAuthor" maxlength="30" placeholder="Ex : Zorg">
    </div>

    <label class="check">
      <input type="checkbox" id="ckQ">
      <span class="box">✔</span>
      <span class="ctext">Proposer des questions</span>
    </label>
    <div class="subpanel hidden" id="panelQ">
      <div class="field">
        <label>QUESTION 1 — réponse OUI / NON ou VRAI / FAUX</label>
        <input type="text" id="pQ1" maxlength="200" placeholder="La question qui clive…">
      </div>
      <div class="field">
        <label>QUESTION OUVERTE 2</label>
        <input type="text" id="pQ2" maxlength="200" placeholder="Pour creuser…">
      </div>
      <div class="field">
        <label>QUESTION OUVERTE 3</label>
        <input type="text" id="pQ3" maxlength="200" placeholder="Pour finir en beauté…">
      </div>
    </div>

    <label class="check">
      <input type="checkbox" id="ckJ">
      <span class="box">✔</span>
      <span class="ctext">Proposer des jokers</span>
    </label>
    <div class="subpanel hidden" id="panelJ">
      <div class="field">
        <label style="color:#f5b93b">🃏 FUN FACT</label>
        <input type="text" id="pJfact" maxlength="300" placeholder="Une anecdote qui relance…">
      </div>
      <div class="field">
        <label style="color:#f5484f">🃏 TRUC DÉRANGEANT</label>
        <input type="text" id="pJmal" maxlength="300" placeholder="Un truc qui met mal à l'aise…">
      </div>
      <div class="field">
        <label style="color:#2fa3f3">🃏 UNPOPULAR OPINION</label>
        <input type="text" id="pJunpop" maxlength="300" placeholder="Une opinion que personne n'ose dire…">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn2 gold" id="pSend">📨 ENVOYER</button>
    </div>
    <div class="form-msg" id="pMsg"></div>
  </div>`;

  /* mini-slider du formulaire */
  const pLvl = $('#pLvl'), pStake = $('#pStake'), pTicks = $('#pTicks');
  pLvl.addEventListener('input', ()=>{
    const v = +pLvl.value, s = STAKES[v-1];
    pStake.textContent = s.name;
    pStake.className = 'stake ' + s.cls;
    [...pTicks.children].forEach((el,i)=>el.classList.toggle('on', i === v-1));
  });

  /* panneaux repliables */
  $('#ckQ').addEventListener('change', e => $('#panelQ').classList.toggle('hidden', !e.target.checked));
  $('#ckJ').addEventListener('change', e => $('#panelJ').classList.toggle('hidden', !e.target.checked));

  $('#pSend').addEventListener('click', submitProposal);
}

async function submitProposal(){
  const msg = $('#pMsg');
  const theme = $('#pTheme').value.trim();

  if(!theme){
    msg.textContent = "Il faut au moins un nom de thème !";
    msg.className = 'form-msg err';
    $('#pTheme').focus();
    return;
  }

  const payload = {
    lvl: +$('#pLvl').value,
    theme: theme,
    author: $('#pAuthor').value.trim(),
    q1: $('#ckQ').checked ? $('#pQ1').value.trim() : '',
    q2: $('#ckQ').checked ? $('#pQ2').value.trim() : '',
    q3: $('#ckQ').checked ? $('#pQ3').value.trim() : '',
    jfact:  $('#ckJ').checked ? $('#pJfact').value.trim()  : '',
    jmal:   $('#ckJ').checked ? $('#pJmal').value.trim()   : '',
    junpop: $('#ckJ').checked ? $('#pJunpop').value.trim() : '',
  };

  const btn = $('#pSend');
  btn.disabled = true;
  msg.textContent = "Envoi en cours…";
  msg.className = 'form-msg';

  try{
    const r = await fetch(PROPOSE_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    track('proposition_envoyee', {niveau: payload.lvl, avec_questions: !!payload.q1, avec_jokers: !!(payload.jfact||payload.jmal||payload.junpop)});
    msg.textContent = "✅ Merci ! Ta proposition est bien envoyée.";
    msg.className = 'form-msg ok';
    setTimeout(goHome, 2000);
  }catch(err){
    msg.textContent = "❌ Échec de l'envoi. Réessaie plus tard.";
    msg.className = 'form-msg err';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
